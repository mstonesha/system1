services:
  web:
    build: .
    container_name: system1-web
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql+psycopg://system1:system1@db:5432/system1
      APP_NAME: Akrasia_Zero
      DISPLAY_NAME: Matt Stone
      APP_TIMEZONE: Europe/London
      FOCUS_SESSION_MINUTES: "25"
      BREAK_DURATION_MINUTES: "5"
      LOG_LEVEL: INFO
      AKRASIA_ANALYSIS_API_TOKEN: ${AKRASIA_ANALYSIS_API_TOKEN:-}
      AKRASIA_PASSWORD_HASH: ${AKRASIA_PASSWORD_HASH:-}
      AKRASIA_COOKIE_SECURE: ${AKRASIA_COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    container_name: system1-db
    environment:
      POSTGRES_USER: system1
      POSTGRES_PASSWORD: system1
      POSTGRES_DB: system1
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U system1 -d system1"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-test:
    image: postgres:17
    container_name: system1-db-test
    environment:
      POSTGRES_USER: system1
      POSTGRES_PASSWORD: system1
      POSTGRES_DB: system1_test
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U system1 -d system1_test"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles:
      - test

  test:
    build:
      context: .
      args:
        INSTALL_DEV: "true"
    container_name: system1-test
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql+psycopg://system1:system1@db-test:5432/system1_test
      APP_NAME: Akrasia_Zero
      DISPLAY_NAME: Matt Stone
      APP_TIMEZONE: Europe/London
      FOCUS_SESSION_MINUTES: "25"
      BREAK_DURATION_MINUTES: "5"
      LOG_LEVEL: INFO
      AKRASIA_ANALYSIS_API_TOKEN: ${AKRASIA_ANALYSIS_API_TOKEN:-}
      AKRASIA_PASSWORD_HASH: ${AKRASIA_PASSWORD_HASH:-}
      AKRASIA_COOKIE_SECURE: ${AKRASIA_COOKIE_SECURE:-false}
    depends_on:
      db-test:
        condition: service_healthy
    command: pytest
    profiles:
      - test

  db-eval:
    image: postgres:17
    container_name: system1-db-eval
    environment:
      POSTGRES_USER: system1
      POSTGRES_PASSWORD: system1
      POSTGRES_DB: system1_agent_eval
    volumes:
      - postgres_eval_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U system1 -d system1_agent_eval"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles:
      - eval

  eval:
    build:
      context: .
      args:
        INSTALL_DEV: "true"
    container_name: system1-eval
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql+psycopg://system1:system1@db-eval:5432/system1_agent_eval
      APP_NAME: Akrasia_Zero
      DISPLAY_NAME: Matt Stone
      APP_TIMEZONE: Europe/London
      FOCUS_SESSION_MINUTES: "25"
      BREAK_DURATION_MINUTES: "5"
      LOG_LEVEL: INFO
      EVAL_AGENT_API_KEY: ${EVAL_AGENT_API_KEY:-}
      EVAL_AGENT_BASE_URL: ${EVAL_AGENT_BASE_URL:-}
      EVAL_AGENT_MODEL: ${EVAL_AGENT_MODEL:-}
    depends_on:
      db-eval:
        condition: service_healthy
    command: python -m evaluation.generate temporal_patterns
    profiles:
      - eval

volumes:
  postgres_data:
  postgres_test_data:
  postgres_eval_data: