services:
  web:
    build: .
    container_name: system1-web
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql+psycopg://system1:system1@db:5432/system1
      APP_TIMEZONE: Europe/London
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    container_name: system1-db
    environment:
      POSTGRES_USER: system1
      POSTGRES_PASSWORD: system1
      POSTGRES_DB: system1
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U system1 -d system1"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-test:
    image: postgres:17
    container_name: system1-db-test
    environment:
      POSTGRES_USER: system1
      POSTGRES_PASSWORD: system1
      POSTGRES_DB: system1_test
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U system1 -d system1_test"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles:
      - test

  test:
    build: .
    container_name: system1-test
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql+psycopg://system1:system1@db-test:5432/system1_test
      APP_TIMEZONE: Europe/London
    depends_on:
      db-test:
        condition: service_healthy
    command: pytest
    profiles:
      - test

volumes:
  postgres_data:
  postgres_test_data: