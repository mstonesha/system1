{% extends "base.html" %}

{% block title %}
Task List | {{ settings.app_name }}
{% endblock %}

{% block task_nav_class %}active{% endblock %}

{% block content %}

<section class="task-list-page">

    <div class="task-list-header">

        <h1 class="task-list-heading">
            Task List
        </h1>

        <label class="inactive-toggle">

            <input
                id="show-inactive"
                type="checkbox"
                name="show_inactive"
                value="true"
                hx-get="/task-tree"
                hx-target="#task-list"
                hx-swap="innerHTML"
                hx-trigger="change"
                hx-include="this"
            >

            <span>
                Show completed / cancelled
            </span>

        </label>

    </div>


    <div
        id="task-list"
        class="task-list"
    >
        {% include "partials/task_tree.html" %}
    </div>


    <div class="new-task-area">

        <button
            type="button"
            class="new-task-toggle"
            onclick="
                const form = document.getElementById('new-task-form');
                form.hidden = !form.hidden;

                if (!form.hidden) {
                    form.querySelector('input[name=title]').focus();
                }
            "
        >
            + Add New Task
        </button>


        <form
            id="new-task-form"
            class="new-task-form"
            hidden
            hx-post="/tasks/create"
            hx-target="#task-list"
            hx-swap="innerHTML"
            hx-include="#show-inactive"
            hx-on::after-request="
                this.reset();
                this.hidden = true;
            "
        >

            {% include "partials/csrf_field.html" %}

            <input
                type="text"
                name="title"
                placeholder="Task name"
                autocomplete="off"
                required
                maxlength="200"
            >

            <button
                type="submit"
                class="primary"
            >
                Add Task
            </button>

            <button
                type="button"
                onclick="
                    const form = document.getElementById('new-task-form');
                    form.reset();
                    form.hidden = true;
                "
            >
                Cancel
            </button>

        </form>

    </div>

</section>

{% endblock %}
