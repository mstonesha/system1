{% extends "base.html" %}

{% block title %}
Tasks | System 1
{% endblock %}

{% block content %}

<section>
    <h2>Tasks</h2>

    <form
        hx-post="/tasks/create"
        hx-target="#task-list"
        hx-swap="beforeend"
        hx-on::after-request="this.reset()"
    >
        <input
            type="text"
            name="title"
            placeholder="New task"
            required
        >

        <button type="submit">
            Add task
        </button>
    </form>

    <ul id="task-list">
        {% for task in tasks %}
            {% include "partials/task_item.html" %}
        {% endfor %}
    </ul>
</section>

{% endblock %}
