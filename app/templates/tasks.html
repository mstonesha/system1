{% extends "base.html" %}

{% block title %}
Tasks | System 1
{% endblock %}

{% block content %}

<section>

    <h2>Tasks</h2>

    <form
        hx-post="/tasks/create"
        hx-target="#task-list"
        hx-swap="innerHTML"
        hx-include="#show-inactive"
        hx-on::after-request="this.reset()"
    >
        <input
            type="text"
            name="title"
            placeholder="New task"
            required
        >

        <button type="submit">
            Add task
        </button>
    </form>


    <div class="task-controls">

        <label>
            <input
                id="show-inactive"
                type="checkbox"
                name="show_inactive"
                value="true"
                hx-get="/task-tree"
                hx-target="#task-list"
                hx-swap="innerHTML"
                hx-trigger="change"
                hx-include="this"
            >

            Show inactive tasks
        </label>

    </div>


    <div id="task-list">
        {% include "partials/task_tree.html" %}
    </div>

</section>

{% endblock %}
