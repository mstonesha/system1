<li id="task-{{ task.id }}" class="task-item">

    <div class="task-row">
        <span
    class="
        task-title
        {% if task.status == 'completed' %}task-completed{% endif %}
        {% if task.status == 'cancelled' %}task-cancelled{% endif %}
    ">
    {{ task.title }}
</span>

        {% if task.status == "active" %}

            <button
                type="button"
                hx-post="/tasks/{{ task.id }}/complete"
                hx-target="#task-{{ task.id }}"
                hx-swap="outerHTML"
            >
                Complete
            </button>

            <button
                type="button"
                hx-post="/tasks/{{ task.id }}/cancel"
                hx-target="#task-{{ task.id }}"
                hx-swap="outerHTML"
            >
                Cancel
            </button>

            <button
                type="button"
                class="subtask-toggle"
                onclick="
                    const form = document.getElementById('subtask-form-{{ task.id }}');
                    form.hidden = !form.hidden;
                "
            >
                + Subtask
            </button>

        {% else %}

            <button
                type="button"
                hx-post="/tasks/{{ task.id }}/reopen"
                hx-target="#task-{{ task.id }}"
                hx-swap="outerHTML"
            >
                Reopen
            </button>

        {% endif %}

    </div>

    {% if task.status == "active" %}

    <form
        id="subtask-form-{{ task.id }}"
        class="subtask-form"
        hidden
        hx-post="/tasks/{{ task.id }}/subtasks"
        hx-target="#children-{{ task.id }}"
        hx-swap="beforeend"
        hx-on::after-request="this.reset(); this.hidden = true;"
    >
        <input
            type="text"
            name="title"
            placeholder="New subtask"
            required
        >

        <button type="submit">
            Add
        </button>
    </form>

    {% endif %}

    <ul id="children-{{ task.id }}" class="task-children">
        {% for child in task.children %}
            {% set task = child %}
            {% include "partials/task_item.html" %}
        {% endfor %}
    </ul>

</li>
