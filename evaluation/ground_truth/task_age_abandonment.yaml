scenario: task_age_abandonment
seed: 20250901
timezone: Europe/London
date_range:
  start: "2025-09-01"
  end: "2026-02-13"
  working_weeks: 24
  weekdays: Monday-Friday
  weekends_excluded: true

purpose: >
  Test whether an analyst given only execution-age abandonment
  buckets and a terminal-task drilldown can recover a population
  association between longer execution age and abandonment, without
  treating age as a deterministic rule, a causal mechanism, or age
  since Task record creation.

age_definition:
  start: first_non_removed_daily_task_date
  end: terminal_task_outcome_date
  unit: local_calendar_days

age_buckets:
  - 0-2
  - 3-7
  - 8-14
  - 15-30
  - 31+

intended_abandonment_rates:
  0-2: "0.05-0.08"
  3-7: "0.08-0.12"
  8-14: "0.15-0.20"
  15-30: "0.30-0.35"
  31+: "0.50-0.60"

tolerances:
  bucket_terminal_n: ">=20 each"
  young_0_7_abandonment: "<0.18"
  old_31_plus_abandonment: ">0.40"
  old_minus_young_gap: ">=0.28"
  over_14_minus_young_gap: ">=0.12"
  execution_gap_stronger_than_created_at_gap: ">=0.06"
  category_abandonment_spread: "<=0.22"
  interruption_abandonment_gap: "<=0.15"
  weekday_abandonment_spread: "<=0.22"
  planned_session_abandonment_gap: "<=0.15"
  rates_are_approximate: true

notes:
  - Ground truth is for evaluation operators only.
  - Do not load this file in the generator's analytical path.
  - Do not supply this file to an agent under test.
  - Age is derived from DailyTask dates; there is no age column.
  - Backlog delays before first DailyTask are independent of fate.
  - Bucket fates are shuffled quotas near the intended rates, not a
    deterministic age threshold.
  - Generator truth may be richer than agent-evaluable truth.
  - >
      The agent must only be judged against claims supported by the
      task-age-v1 evidence contract. That contract exposes
      execution-age abandonment buckets and datable terminal-task
      rows. It does not expose Task.created_at or an alternative
      backlog-age comparison.

agent_evidence_contract: task-age-v1

# Planted in the synthetic generator. Useful for validating scenario
# construction. Not all of these are recoverable from task-age-v1.
generator_truth:
  - abandonment_probability_rises_with_execution_age
  - tasks_over_14_days_show_materially_higher_abandonment_than_tasks_under_8_days
  - tasks_31_plus_days_have_the_highest_abandonment_rate
  - first_today_commitment_is_more_informative_than_task_created_at

expected_non_patterns:
  - no_meaningful_weekday_effect
  - no_meaningful_daypart_effect
  - no_meaningful_interruption_effect
  - no_material_category_abandonment_effect
  - no_material_planned_session_effect

# True in the generator but not scored against the agent, because
# task-age-v1 does not expose created-at age, backlog delay, or
# confound slices.
not_agent_evaluable:
  - first_today_commitment_is_more_informative_than_task_created_at
  - created_at_age_is_a_weaker_abandonment_signal
  - hidden_backlog_delay_is_independent_of_fate
  - category_does_not_explain_the_age_pattern
  - interruptions_do_not_explain_the_age_pattern

agent_expected_patterns:
  - abandonment_probability_rises_with_execution_age
  - older_execution_age_buckets_show_materially_higher_abandonment
  - relationship_is_a_population_association_not_a_deterministic_rule

agent_expected_hypotheses:
  - longer_execution_age_may_reflect_unresolved_obstacles_deprioritisation_or_difficulty

agent_expected_insufficient_evidence:
  - execution_age_does_not_have_a_demonstrated_causal_effect
  - older_tasks_are_not_guaranteed_to_be_abandoned
  - younger_tasks_are_not_guaranteed_to_complete
  - supplied_metric_is_not_age_since_task_record_creation
  - reopen_and_undatable_limitations_constrain_interpretation

agent_should_be_able_to_say:
  - abandonment rates generally increase as execution age increases
  - the increase is especially substantial in the older buckets
  - this is a population-level association, not a deterministic rule
  - older tasks can still complete
  - younger tasks can still be abandoned
  - the evidence does not establish that execution age causes abandonment
  - the metric is execution age from first recorded non-removed Today appearance, not Task creation age
  - production limitations may affect reopened or undatable tasks

agent_should_not_claim:
  - ageing causes abandonment
  - tasks older than 31 days will be abandoned
  - old tasks are doomed
  - every older task is abandoned
  - a specific age threshold guarantees failure
  - the supplied metric is age since Task record creation
  - backlog age is equivalent to execution age
  - category or interruptions explain the age pattern
  - individual counterexamples disprove a broader population association
