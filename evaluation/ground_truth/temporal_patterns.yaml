scenario: temporal_patterns
seed: 20250106
timezone: Europe/London
date_range:
  start: "2025-01-06"
  end: "2025-03-28"
  working_weeks: 12
  weekdays: Monday-Friday
  weekends_excluded: true

purpose: >
  Test whether an analyst can recover a planted temporal pattern:
  mornings are generally stronger, except Monday mornings.

notes:
  - Ground truth is for evaluation operators only.
  - Do not load this file in the generator's analytical path.
  - Do not supply this file to an agent under test.

expected_patterns:
  - mornings_have_highest_positive_outcome_rate_overall
  - late_afternoon_has_lower_positive_outcome_rate
  - monday_morning_is_a_strong_negative_exception
  - tuesday_to_friday_mornings_are_consistently_strong

expected_non_patterns:
  - interruptions_do_not_explain_the_temporal_pattern
  - task_age_does_not_explain_the_temporal_pattern
  - task_category_does_not_explain_the_temporal_pattern

agent_should_be_able_to_say:
  - morning sessions generally have better outcomes
  - monday morning is materially worse than other mornings
  - the broad morning advantage is not uniform across weekdays

agent_should_not_claim:
  - mornings cause better performance
  - monday itself is always the worst day
  - all afternoon work performs badly
  - the pattern applies beyond the observed period
